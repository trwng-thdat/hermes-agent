name: phoenix
version: "1.0.0"
description: "Optional Arize Phoenix observability for Hermes — traces agent turns, LLM calls, and tool usage as OpenInference/OTLP spans, routed to three projects (agent-chat / wiki / cron) by turn origin. Opt-in via `hermes plugins enable observability/phoenix`."
author: NousResearch
requires_env:
  - HERMES_PHOENIX_ENDPOINT
provides_hooks:
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_finalize
  - on_session_end
  - subagent_start
  - subagent_stop
